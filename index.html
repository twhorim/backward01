<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
</head>
<body>
<title>백워드 설계 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 단계 목록(왼쪽) · 작성 칸(가운데) · 제미나이 노트북 패널(오른쪽, 고정) — 연수 템플릿 14장과 같은 순서 */
:root {
  --bg: #F4F7FB; --surface: #FFFFFF; --sunk: #EEF2F8; --ink: #13213A; --muted: #5A6A82; --faint: #8796AC;
  --line: #D7DFEA; --navy: #0B2A5B; --navy-soft: #E6EDF7; --teal: #0C7F81; --teal-soft: #E3F3F3;
  --amber: #A86A0F; --amber-soft: #FCF1DE; --red: #B83A0C; --red-soft: #FBE9E2; --ok: #1F7A4D;
  --code-bg: #0F1B33; --code-fg: #EAF0F8; --code-label: #7DD3D3;
  --f-head: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C121C; --surface: #141C29; --sunk: #101722; --ink: #E5ECF6; --muted: #9AAAC0; --faint: #6F7F96;
  --line: #263247; --navy: #9DBDF2; --navy-soft: #18263D; --teal: #4FC6C8; --teal-soft: #102C2E;
  --amber: #F0B451; --amber-soft: #2B2212; --red: #F08A62; --red-soft: #2E1A13; --ok: #5FD39A;
  --code-bg: #070C15; --code-fg: #E3EAF5; --code-label: #7DD3D3; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C121C; --surface: #141C29; --sunk: #101722; --ink: #E5ECF6; --muted: #9AAAC0; --faint: #6F7F96;
  --line: #263247; --navy: #9DBDF2; --navy-soft: #18263D; --teal: #4FC6C8; --teal-soft: #102C2E;
  --amber: #F0B451; --amber-soft: #2B2212; --red: #F08A62; --red-soft: #2E1A13; --ok: #5FD39A;
  --code-bg: #070C15; --code-fg: #E3EAF5; --code-label: #7DD3D3; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-head); text-wrap: balance; margin: 0; line-height: 1.3; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; max-width: 1480px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 18px; color: var(--navy); }
.brand small { color: var(--muted); font-size: 12.5px; }
.top-meta { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.team { background: var(--navy-soft); color: var(--navy); border-color: transparent; }
.pill.saved::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

.example-bar { background: var(--amber-soft); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.example-bar .in { max-width: 1480px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.example-bar b { color: var(--amber); }

/* shell */
.shell { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px; }
nav.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); align-self: start; max-height: calc(100vh - 90px); overflow-y: auto; padding-right: 4px; }
.grp { margin-bottom: 14px; }
.grp-h { font-family: var(--f-head); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; color: var(--faint); padding: 0 8px 4px; }
.grp-h .t { float: right; font-family: var(--f-mono); letter-spacing: 0; }
.step-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; font-size: 14px; color: var(--ink); }
.step-btn:hover { background: var(--sunk); }
.step-btn.on { background: var(--navy-soft); color: var(--navy); font-weight: 700; }
.step-btn .no { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); width: 22px; flex: none; }
.step-btn .dot { margin-left: auto; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }
.step-btn .dot.half { border-color: var(--amber); background: linear-gradient(90deg, var(--amber) 50%, transparent 50%); }
.step-btn .dot.full { border-color: var(--ok); background: var(--ok); }
.step-btn.hot .lbl::after { content: "핵심"; margin-left: 6px; font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--red-soft); color: var(--red); font-weight: 700; }

/* main */
main { min-width: 0; }
.step-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; margin-bottom: 16px; }
.step-head .chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--navy); color: var(--surface); }
.step-head .chip.teal { background: var(--teal); }
.step-head .chip.red { background: var(--red); }
.step-head .chip.amber { background: var(--amber); }
.step-head h2 { font-size: 24px; flex-basis: 100%; }
.step-head p { margin: 0; color: var(--muted); flex: 1 1 420px; }
.step-head .slide { font-family: var(--f-mono); font-size: 12px; color: var(--faint); white-space: nowrap; }

.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.nb { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow-y: auto; background: var(--sunk); }
.panel-h { display: flex; align-items: center; gap: 8px; font-family: var(--f-head); font-weight: 700; font-size: 15px; margin-bottom: 12px; }
.panel-h .tag { font-family: var(--f-body); font-size: 11.5px; font-weight: 500; color: var(--muted); margin-left: auto; }

/* form */
.f { display: grid; gap: 14px; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
label.fl { display: grid; gap: 5px; min-width: 0; }
.fl > span { font-size: 13px; font-weight: 700; color: var(--navy); }
.fl > span em { font-style: normal; font-weight: 400; color: var(--muted); margin-left: 6px; }
input[type=text], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14.5px; line-height: 1.55; }
textarea { resize: vertical; min-height: 64px; }
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, textarea:focus, select:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
.box-soft { background: var(--teal-soft); border-radius: 8px; padding: 12px 14px; }
.box-amber { background: var(--amber-soft); border-radius: 8px; padding: 12px 14px; }
.box-red { background: var(--red-soft); border-radius: 8px; padding: 12px 14px; }
.box-amber h4, .box-soft h4, .box-red h4 { margin: 0 0 6px; font-family: var(--f-head); font-size: 14px; }
.box-amber h4 { color: var(--amber); } .box-soft h4 { color: var(--teal); } .box-red h4 { color: var(--red); }
.checks { display: grid; gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.checks input { margin-top: 5px; accent-color: var(--teal); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.sub-h { font-family: var(--f-head); font-size: 15px; font-weight: 700; margin: 4px 0 -4px; color: var(--ink); }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13.5px; }
.t th { background: var(--navy); color: var(--surface); font-weight: 700; padding: 7px 8px; text-align: center; font-size: 12.5px; white-space: nowrap; }
:root[data-theme="dark"] .t th { color: #0C121C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .t th { color: #0C121C; } }
.t td { border-top: 1px solid var(--line); padding: 4px; vertical-align: top; background: var(--surface); }
.t td.lab { background: var(--navy-soft); color: var(--navy); font-weight: 700; text-align: center; vertical-align: middle; padding: 6px 8px; white-space: nowrap; }
.t td.q { color: var(--muted); font-size: 12.5px; vertical-align: middle; padding: 6px 8px; min-width: 140px; }
.t textarea, .t input[type=text] { border-color: transparent; background: transparent; min-height: 52px; padding: 6px; font-size: 13.5px; }
.t input[type=text] { min-height: 0; }
.t textarea:hover, .t input:hover { border-color: var(--line); }
.t tr.core td { background: var(--amber-soft); }
.star { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 30px; color: var(--faint); }
.star.on { color: var(--amber); border-color: var(--amber); font-weight: 700; }
.score { width: 40px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; }
.score.o { color: var(--ok); border-color: var(--ok); } .score.t { color: var(--amber); border-color: var(--amber); } .score.x { color: var(--red); border-color: var(--red); background: var(--red-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; font-size: 13px; }
.chipbtn.on { background: var(--teal); border-color: var(--teal); color: var(--surface); font-weight: 700; }
:root[data-theme="dark"] .chipbtn.on { color: #0C121C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chipbtn.on { color: #0C121C; } }
.verdict { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 8px; }
.verdict.bad { background: var(--red-soft); color: var(--red); } .verdict.good { background: var(--teal-soft); color: var(--teal); }

/* notebook prompt cards */
.pc { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.pc-h { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pc-h b { font-size: 13.5px; font-family: var(--f-head); }
.where { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
.where.chat { background: var(--navy-soft); color: var(--navy); }
.where.studio { background: var(--amber-soft); color: var(--amber); }
.where.gem { background: var(--teal-soft); color: var(--teal); }
.state { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.state.ready { color: var(--ok); font-weight: 700; }
pre.prompt { margin: 0; background: var(--code-bg); color: var(--code-fg); font-family: var(--f-mono); font-size: 12.5px; line-height: 1.65; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
pre.prompt .ph { color: #F0B451; }
.pc-f { display: flex; gap: 8px; padding: 8px 12px; align-items: center; flex-wrap: wrap; }
.pc-f .why { font-size: 12.5px; color: var(--muted); flex: 1 1 200px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500; }
.btn:hover { border-color: var(--teal); }
.btn.pri { background: var(--navy); border-color: var(--navy); color: var(--surface); font-weight: 700; }
:root[data-theme="dark"] .btn.pri { color: #0C121C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.pri { color: #0C121C; } }
.btn.warn { color: var(--red); border-color: var(--red); }
.btn[disabled] { opacity: .5; cursor: default; }
.memo { margin-top: 4px; }
.memo textarea { min-height: 90px; background: var(--surface); }
details.ref { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-top: 12px; }
details.ref summary { cursor: pointer; padding: 9px 12px; font-weight: 700; font-size: 13.5px; font-family: var(--f-head); }
details.ref .in { padding: 0 12px 12px; font-size: 13.5px; }
details.ref table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 12.5px; }
details.ref td, details.ref th { border-top: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
details.ref th { color: var(--muted); font-weight: 700; }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* setup steps */
.setup { counter-reset: s; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.setup li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.setup li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 13px; font-family: var(--f-mono); }
:root[data-theme="dark"] .setup li::before { color: #0C121C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .setup li::before { color: #0C121C; } }
.setup b { display: block; }
.setup span { color: var(--muted); font-size: 13.5px; }

/* summary */
.sum { display: grid; gap: 14px; }
.sum section { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--surface); min-width: 0; }
.sum h3 { font-size: 15px; color: var(--navy); margin-bottom: 6px; }
.sum pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--f-body); font-size: 13.5px; }
.empty-mark { color: var(--faint); }

@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .nb { position: static; max-height: none; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.steps { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .grp { display: contents; }
  .grp-h { display: none; }
  .step-btn { flex: none; width: auto; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
  .step-btn.hot .lbl::after { display: none; }
  .brand small { display: none; }
}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><h1>백워드 설계 노트</h1><small>제미나이 노트북과 함께 쓰는 AI·디지털 기반 수업 설계 · 2026. 10. 31. 심화연수</small></div>
  <div class="top-meta"><span class="pill team" id="teamPill">팀 미입력</span><span class="pill saved" id="savePill">이 브라우저에 자동 저장</span></div>
</div></header>
<div class="example-bar" id="exampleBar" hidden><div class="in">
  <span><b>예시 설계안</b> 정보 「우리 동네 AI 탐정단」이 채워져 있습니다. 둘러본 뒤 비우고 우리 팀 설계를 시작하세요.</span>
  <span id="clearArea"><button class="btn warn" id="clearBtn" type="button">비우고 내 설계 시작</button></span>
</div></div>

<div class="shell">
  <nav class="steps" id="nav" aria-label="설계 단계"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
"use strict";
// ---------------- reference data ----------------
var PATTERNS = ["AI 결과 검증·반박", "역할 분담 협업", "브레인라이팅 → 범주화", "입장 투표 → 토론", "근거 기반 동료평가", "AI 페르소나 대화"];
var ROLES = ["검증 대상", "반대 토론자", "질문하는 코치", "탐구 시뮬레이터", "자료 생성(교사용)", "AI 쓰지 않음"];
var CRITERIA = [["목적 적합성", "성취기준 동사의 사고를 학생이 직접 하는가?"], ["상호작용 유발", "도구를 빼면 학생 간 대화도 사라지는가?"], ["학습 증거", "학생의 사고 과정이 기록으로 남는가?"], ["접근성·안전", "학생 계정·연령 기준, 개인정보, 학교 기기에서 되는가?"], ["운영 부담", "학생이 5분 안에 익히는가?"]];
var TOOLMAP = [
  ["패들렛", "역할 분담 · 동료평가", "모둠별 섹션 + 필수 입력란(근거·반론) + 댓글 켬, 좋아요 끔", "결과물 올리고 하트 누르기"],
  ["캔바 화이트보드", "브레인라이팅 → 범주화", "개인 스티커 → 함께 묶고 이름 붙이기", "각자 꾸미기 경쟁"],
  ["생성형 AI", "AI 결과 검증·반박", "AI 답에서 오류를 찾아 근거로 반박", "답을 받아 그대로 옮겨 적기"],
  ["젬(Gem)", "AI 페르소나 대화", "반대 입장 인물을 지정, 모둠이 함께 논쟁", "개인별 정답 질문"],
  ["제미나이 캔버스", "탐구 · 예측", "모둠이 변수를 바꿔 예측 → 결과 비교 토론", "교사 시연만 보기"],
  ["제미나이 노트북", "근거 기반 토론", "교사가 소스 선별 → 학생이 출처를 들어 주장", "요약본 읽고 끝"],

  var report = "소스의 '백워드 설계안'만 사용해서 핵심 차시의 교수·학습 과정안을 작성해 줘.\n구성: 단원명, 성취기준, 학습목표, 수업 흐름 표(단계·시간·교사 활동·학생 활동·상호작용·AI·디지털 도구·평가), 평가 계획(루브릭), 유의점.\n문체는 개조식(~함, ~임)으로 하고, 소스에 없는 활동은 추가하지 마.";
  var left = '<section class="panel f"><div class="row"><button type="button" class="btn pri" id="allCopy">설계안 전체 텍스트 복사</button><button type="button" class="btn" id="bkCopy">백업 코드 복사</button></div>' +
    '<p class="hint">전체 텍스트는 구글 슬라이드 템플릿에 옮기거나, 노트북에 소스 ④로 추가할 때 씁니다. 이 페이지 내용은 지금 쓰는 브라우저에만 저장되므로, 다른 컴퓨터에서 이어 쓰려면 백업 코드를 복사해 두세요.</p>' +
    '<div class="sum">' + secs + "</div>" +
    '<div class="sub-h">백업 불러오기</div><textarea id="bkIn" rows="3" placeholder="복사해 둔 백업 코드를 여기에 붙여 넣으세요"></textarea><div class="row"><button type="button" class="btn" id="bkLoad">백업 불러오기</button><span id="bkMsg" class="hint"></span></div>' +
    '<div class="sub-h">처음부터 다시</div><div class="row"><span id="resetArea"><button type="button" class="btn warn" id="resetBtn">모두 비우기</button></span><button type="button" class="btn" id="exBtn">예시(AI 탐정단) 다시 보기</button></div></section>';
  var right = nbPanel("sum", [
    card("chat", "소스 ④로 설계안 추가하기", "1. 왼쪽 '설계안 전체 텍스트 복사'를 누릅니다.\n2. 노트북 → 소스 추가 → 복사된 텍스트에 붙여 넣습니다.\n3. 소스 이름을 '백워드 설계안'으로 바꿉니다.\n4. 아래 스튜디오 프롬프트를 사용합니다.", [], "안내문입니다.", true),
    card("studio", "교수·학습 과정안 (스튜디오 보고서)", report, ["core.goal"], "스튜디오 → 보고서 → 직접 만들기에 붙여넣기"),
    card("chat", "설계안 최종 점검", "소스의 '백워드 설계안'과 '연수 핵심 자료'를 비교해서, 우리 설계안이 ① 성취기준 동사 – 루브릭 – 활동의 정합성 ② 도구 선택 기준 5가지 ③ 학생 → 학생 상호작용 흐름을 지켰는지 항목별로 판정해 줘. 부족한 점은 질문으로만 알려 줘.", [], "")]);
  return head(st, "단계별 내용을 한 번에 모아 봅니다. 미작성 칸을 확인하고, 텍스트를 구글 슬라이드와 노트북으로 옮깁니다.") + '<div class="cols">' + left + right + "</div>";
};

// ---------------- render ----------------
var nav = document.getElementById("nav"), main = document.getElementById("main");
function renderNav() {
  var html = "", lastG = "";
  STEPS.forEach(function (st, i) {
    if (st.grp !== lastG) { if (lastG) html += "</div>"; html += '<div class="grp"><div class="grp-h">' + st.grp + (GRP_TIME[st.grp] ? '<span class="t">' + GRP_TIME[st.grp] + "</span>" : "") + "</div>"; lastG = st.grp; }
    var p = st.id === "sum" ? -1 : progress(st.id);
    html += '<button type="button" class="step-btn' + (S.meta.step === i ? " on" : "") + (st.hot ? " hot" : "") + '" data-step="' + i + '"' + (S.meta.step === i ? ' aria-current="step"' : "") + '><span class="no">' + st.no + '</span><span class="lbl">' + st.name + "</span>" + (p < 0 ? "" : '<span class="dot ' + (p >= 0.99 ? "full" : p > 0 ? "half" : "") + '" title="' + Math.round(p * 100) + '%"></span>') + "</button>";
  });
  nav.innerHTML = html + "</div>";
  document.getElementById("teamPill").textContent = v(S.info.team) || "팀 미입력";
  document.getElementById("exampleBar").hidden = !S.meta.example;
}
function renderMain(keepScroll) {
  var st = STEPS[S.meta.step] || STEPS[0];
  var pager = '<div class="pager">' + (S.meta.step > 0 ? '<button type="button" class="btn" data-step="' + (S.meta.step - 1) + '">← ' + STEPS[S.meta.step - 1].name + "</button>" : "<span></span>") + (S.meta.step < STEPS.length - 1 ? '<button type="button" class="btn pri" data-step="' + (S.meta.step + 1) + '">' + STEPS[S.meta.step + 1].name + " →</button>" : "") + "</div>";
  main.innerHTML = R[st.id](st) + pager;
  if (!keepScroll) window.scrollTo(0, 0);
}
// refresh only the notebook panel (keeps focus in the form)
function refreshPanel() {
  var st = STEPS[S.meta.step]; var tmp = document.createElement("div"); tmp.innerHTML = R[st.id](st);
  var newNb = tmp.querySelector(".nb"), oldNb = main.querySelector(".nb");
  if (newNb && oldNb) {
    var oldCards = oldNb.querySelectorAll(".pc"), newCards = newNb.querySelectorAll(".pc");
    newCards.forEach(function (c, i) { if (oldCards[i]) oldCards[i].replaceWith(c); });
  }
  var newSum = tmp.querySelector(".sum"), oldSum = main.querySelector(".sum");
  if (newSum && oldSum) oldSum.replaceWith(newSum);
  var newV = tmp.querySelectorAll(".verdict"); var oldV = main.querySelectorAll("section.panel > .verdict");
  if (st.id === "tools") { oldV.forEach(function (x) { x.remove(); }); var anchor = main.querySelector('label.fl textarea[data-p="tools.chosen"]'); if (anchor) { var lab = anchor.closest("label"); tmp.querySelectorAll("section.panel > .verdict").forEach(function (x) { lab.parentNode.insertBefore(x, lab); }); } }
}
function go(i) { S.meta.step = Math.max(0, Math.min(STEPS.length - 1, i)); save(); renderNav(); renderMain(); }

var toastEl = document.getElementById("toast"), toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove("show"); }, 1800); }
function copyText(text, btn) {
  function fallback() {
    var t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(t);
    if (ok) toast("복사했습니다"); else { var pre = btn && btn.closest(".pc") ? btn.closest(".pc").querySelector("pre") : null; if (pre) { var r = document.createRange(); r.selectNodeContents(pre); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("선택된 글을 Ctrl+C로 복사하세요"); }
  }
  try { navigator.clipboard.writeText(text).then(function () { toast("복사했습니다"); }, fallback); } catch (e) { fallback(); }
}

// ---------------- events ----------------
document.addEventListener("input", function (e) {
  var p = e.target.getAttribute("data-p"); if (!p) return;
  set(p, e.target.value);
  if (p.indexOf("memo.") !== 0) S.meta.example = S.meta.example; // example flag stays until cleared
  save(); renderNav(); refreshPanel();
});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.tagName === "SELECT" && t.getAttribute("data-p")) { set(t.getAttribute("data-p"), t.value); save(); renderNav(); refreshPanel(); }
  if (t.hasAttribute("data-gate")) { S.idea.gate[+t.getAttribute("data-gate")] = t.checked; save(); renderNav(); }
});
document.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-step")) { go(+b.getAttribute("data-step")); return; }
  if (b.hasAttribute("data-copy")) { copyText(decodeURIComponent(b.getAttribute("data-copy")), b); return; }
  if (b.hasAttribute("data-core")) { var i = +b.getAttribute("data-core"); S.flowCore = S.flowCore === i ? -1 : i; save(); renderNav(); renderMain(true); return; }
  if (b.hasAttribute("data-score")) { var ij = b.getAttribute("data-score").split("."); var c = S.tools.cands[+ij[0]].s; var cyc = { "": "o", o: "t", t: "x", x: "" }; c[+ij[1]] = cyc[c[+ij[1]]]; save(); renderNav(); renderMain(true); return; }
  if (b.hasAttribute("data-role")) { var r = b.getAttribute("data-role"); var a = S.tools.roles; var k = a.indexOf(r); if (k >= 0) a.splice(k, 1); else a.push(r); save(); renderMain(true); return; }
  if (b.hasAttribute("data-remove")) { S.core.remove = S.core.remove === b.getAttribute("data-remove") ? "" : b.getAttribute("data-remove"); save(); renderNav(); renderMain(true); return; }
  if (b.hasAttribute("data-persona")) { S.meta.persona = b.getAttribute("data-persona"); save(); renderMain(true); return; }
  if (b.id === "clearBtn" || b.id === "resetBtn") {
    var area = b.parentNode; var orig = area.innerHTML;
    area.innerHTML = '<span class="hint" style="display:inline">모든 칸을 비웁니다. </span><button type="button" class="btn warn" data-confirm="clear">비우기</button> <button type="button" class="btn" data-confirm="cancel">취소</button>';
    area.setAttribute("data-orig", orig); return;
  }
  if (b.getAttribute("data-confirm") === "cancel") { var ar = b.parentNode; ar.innerHTML = ar.getAttribute("data-orig"); return; }
  if (b.getAttribute("data-confirm") === "clear") { S = blank(); S.meta.step = 0; save(); renderNav(); renderMain(); toast("비웠습니다. 기본 정보부터 시작하세요"); return; }
  if (b.id === "exBtn") { S = example(); S.meta.step = 12; save(); renderNav(); renderMain(); toast("예시를 불러왔습니다"); return; }
  if (b.id === "allCopy") { copyText(designText(), b); return; }
  if (b.id === "bkCopy") { copyText(JSON.stringify(S), b); return; }
  if (b.id === "bkLoad") {
    var msg = document.getElementById("bkMsg");
    try { var data = JSON.parse(document.getElementById("bkIn").value.trim()); if (!data || !data.info || !data.std) throw new Error("x"); S = merge(blank(), data); S.meta.step = 12; save(); renderNav(); renderMain(); toast("백업을 불러왔습니다"); }
    catch (err) { msg.textContent = "백업 코드를 읽지 못했습니다. '백업 코드 복사'로 만든 글 전체를 붙여 넣었는지 확인하세요."; }
    return;
  }
});

renderNav(); renderMain();
})();
</script>
